<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cardio Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">

        <button
            class="back-button"
            onclick="goBack()"
        >
            ⬅️ TORNA ALLA HOME
        </button>

        <h1>
            ❤️ Cardio Tracker
        </h1>

    </nav>

    <div class="container">

        <div class="form-container">

            <select id="exerciseName"> <!--implementazione del menù a tendina per selezionare attività-->

                <option value="">Seleziona attività</option>

                <option>Tapis roulant</option>
                <option>Cyclette</option>
                <option>Bicicletta lenta</option>
                <option>Bicicletta normale</option>
                <option>Bicicletta veloce</option>
                <option>Scale</option>
                <option>Camminata lenta</option>
                <option>Camminata normale</option>
                <option>Camminata veloce</option>
                <option>Mountain bike</option>
                <option>Corsa lenta</option>
                <option>Corsa normale</option>
                <option>Corsa veloce</option>
                <option>Nuoto</option>
                <option>Acquagym</option>
                <option>Salto con la corda</option>
                <option>Calcio</option>
                <option>Tennis</option>
                <option>Basket</option>
                <option>Pallavolo</option>
                <option>Pattinaggio</option>
                <option>Zumba</option>
                <option>Danza</option>

            </select>

            <input
                type="number"
                id="minutes"
                placeholder="Minuti"
            >

            <input
                type="number"
                id="speed"
                placeholder="Velocità (km/h)"
            >

            <input
                type="number"
                id="resistance"
                placeholder="Inclinazione / Resistenza"
            >

            <input
                type="text"
                id="notes"
                placeholder="Note"
            >

            <button id="addCardioBtn">

                Aggiungi Attività

            </button>

        </div>

        <table class="exercise-table">

            <thead>

                <tr>

                    <th>
                        Esercizio
                    </th>

                    <th>
                        Minuti
                    </th>

                    <th>
                        Velocità(km/h)
                    </th>

                    <th>
                        Inclinazione / Resistenza
                    </th>

                    <th>
                        Calorie Bruciate
                    </th>

                    <th>
                        Note
                    </th>

                    <th>
                        Azioni
                    </th>

                </tr>

            </thead>

            <tbody id="cardioTableBody">

            </tbody>

        </table>

    </div>

    <script src="cardio.js"></script>

</body>

</html>
